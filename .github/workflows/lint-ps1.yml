# lint-ps1.yml
#
# 守卫：仓库内所有 .ps1 必须能被 Windows PowerShell 5.1 解析，且文件头 BOM 数量正确。
#
# 为什么单独开这条：PS 5.1 只消化第一个 UTF-8 BOM，多余的 BOM 会变成正文首字符
# U+FEFF，报出一堆看着像真实语法错误的解析失败（InvalidLeftHandSide /
# ReservedKeywordNotAllowed 等）；而编辑器和 AI 工具会悄悄增删 BOM，此前只在人工
# 触发构建时才暴露，导致同一处文件头反复返工。把检查挂到每次 push/PR，
# 问题在仓库门口就被挡下，不再依赖人工记得复查文件头。
# 判定逻辑与本地可跑的是同一份脚本：scripts/check-ps1.ps1（见 doc/lessons.md §1.3）。

name: Lint PowerShell

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ps1:
    name: Check .ps1 BOM + PS 5.1 parseability
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check .ps1 BOM + PS 5.1 parseability
        shell: powershell
        run: |
          & .\scripts\check-ps1.ps1
