name: Build pnpm (Windows)

# Manual build + auto release: Actions -> "Build pnpm (Windows)" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      pnpm_version:
        description: 'pnpm version without "v", e.g. 12.11.2. Leave empty for the latest stable release on the major track below carrying pnpm-win32-x64.zip.'
        required: false
        default: ''
      major_track:
        description: 'Major version track for auto-discovery, e.g. 12. Ignored when pnpm_version is set. Default 12.'
        required: false
        default: '12'
      draft_release:
        description: 'Publish the GitHub release as a draft.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installer and publish release
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup not preinstalled, installing via Chocolatey...'
            choco install innosetup -y --no-progress --limit-output
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          # NOTE: do NOT run `iscc /?` to verify: it prints help and exits 1,
          # which fails the step. Report the binary version from file metadata.
          $isccVer = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "ISCC ready: $iscc (version $isccVer)"

      - name: Build pnpm installer
        id: build
        shell: powershell
        env:
          # build.ps1 的 GitHub Releases API 版本发现需要 GITHUB_TOKEN 提高速率限额
          # （匿名 60 req/h → 认证 1000 req/h）。此处显式注入，防止 PowerShell
          # 进程未继承 job-level 的自动注入。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\builders\pnpm\build.ps1 -PnpmVersion '${{ inputs.pnpm_version }}' -MajorTrack '${{ inputs.major_track }}'

      - name: Show build metadata
        shell: powershell
        run: |
          Get-Content .\build\output\build-info.json
          Write-Host "pnpm version = ${{ steps.build.outputs.pnpm_version }}"
          Write-Host "Installer    = ${{ steps.build.outputs.setup_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: pnpm-${{ steps.build.outputs.pnpm_version }}-setup-x64
          if-no-files-found: error
          path: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json
            build/output/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: pnpm-${{ steps.build.outputs.pnpm_version }}
          name: 'pnpm ${{ steps.build.outputs.pnpm_version }} Windows x64 一键安装包'
          body_path: build/output/release-notes.md
          draft: ${{ inputs.draft_release }}
          files: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json
