name: Build Git (Windows)

on:
  workflow_dispatch:
    inputs:
      git_version:
        description: 'Exact Git tag name without leading "v", e.g. 2.56.0.windows.2. Leave empty for the latest stable v2.x.windows.y release carrying PortableGit-*-64-bit.7z.exe.'
        required: false
        default: ''
      draft_release:
        description: 'Publish the GitHub release as a draft.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installer and publish release
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup not preinstalled, installing via Chocolatey...'
            choco install innosetup -y --no-progress --limit-output
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          $isccVer = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "ISCC ready: $iscc (version $isccVer)"

      - name: Locate 7-Zip
        shell: powershell
        run: |
          $sevenZ = @(
            'C:\Program Files\7-Zip\7z.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $sevenZ) {
            Write-Host '7-Zip not preinstalled, installing via Chocolatey...'
            choco install 7zip -y --no-progress --limit-output
            $sevenZ = 'C:\Program Files\7-Zip\7z.exe'
          }
          if (-not (Test-Path $sevenZ)) { throw "7z.exe not found at $sevenZ" }
          "7Z=$sevenZ" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "7z ready: $sevenZ"

      - name: Build Git installer
        id: build
        shell: powershell
        env:
          # build.ps1 的 GitHub Releases API 版本发现需要 GITHUB_TOKEN 提高速率限额
          # （匿名 60 req/h → 认证 1000 req/h）。此处显式注入，防止 PowerShell
          # 进程未继承 job-level 的自动注入。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\builders\git\build.ps1 -GitVersion '${{ inputs.git_version }}'

      - name: Show build metadata
        shell: powershell
        run: |
          Get-Content .\build\output\build-info.json
          Write-Host "Git version = ${{ steps.build.outputs.git_version }}"
          Write-Host "Installer   = ${{ steps.build.outputs.setup_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: git-${{ steps.build.outputs.git_version }}-setup-x64
          if-no-files-found: error
          path: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json
            build/output/release-notes.md

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: git-${{ steps.build.outputs.git_version }}
          name: 'Git ${{ steps.build.outputs.git_version }} Windows x64 一键安装包'
          body_path: build/output/release-notes.md
          draft: ${{ inputs.draft_release }}
          files: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json
