name: Build PHP 8.5

# Manual build + auto release: Actions -> "Build PHP 8.5 (Windows)" -> Run workflow
on:
  workflow_dispatch:
    inputs:
      php_version:
        description: 'PHP 8.5 patch version, e.g. 8.5.11. Leave empty for the latest published 8.5.x.'
        required: false
        default: ''
      nilpack_version:
        description: 'php-nil/nilpack release tag without "v", bundled as the nil command. Default 0.2.'
        required: false
        default: '0.2'
      draft_release:
        description: 'Publish the GitHub release as a draft.'
        type: boolean
        required: false
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installer and publish release
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup not preinstalled, installing via Chocolatey...'
            choco install innosetup -y --no-progress --limit-output
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          # NOTE: do NOT run `iscc /?` to verify: it prints help and exits 1,
          # which fails the step. Report the binary version from file metadata.
          $isccVer = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "ISCC ready: $iscc (version $isccVer)"

      - name: Build PHP 8.5 installer
        id: build
        shell: powershell
        run: |
          & .\builders\php\build.ps1 -PhpVersion '${{ inputs.php_version }}' -NilpackVersion '${{ inputs.nilpack_version }}'

      - name: Show build metadata
        shell: powershell
        run: |
          Get-Content .\build\output\build-info.json
          Write-Host "PHP version   = ${{ steps.build.outputs.php_version }}"
          Write-Host "Xdebug version= ${{ steps.build.outputs.xdebug_version }}"
          Write-Host "APCu version  = ${{ steps.build.outputs.apcu_version }}"
          Write-Host "Composer ver. = ${{ steps.build.outputs.composer_version }}"
          Write-Host "Installer     = ${{ steps.build.outputs.setup_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: php-${{ steps.build.outputs.php_version }}-setup-x64
          if-no-files-found: error
          path: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json
            build/output/release-notes.md

      - name: Check versioned release
        id: rel
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\scripts\test-release-published.ps1 -Tag 'php-${{ steps.build.outputs.php_version }}'

      - name: Publish GitHub release
        if: steps.rel.outputs.published != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: php-${{ steps.build.outputs.php_version }}
          name: 'PHP ${{ steps.build.outputs.php_version }} Windows x64 一键安装包'
          body_path: build/output/release-notes.md
          draft: ${{ inputs.draft_release }}
          files: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json

      - name: Publish evergreen alias release
        if: ${{ !inputs.draft_release }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\scripts\publish-alias-release.ps1 -Env 'php' -Version '${{ steps.build.outputs.php_version }}' -AssetPath 'build/output/${{ steps.build.outputs.setup_name }}' -VersionedTag 'php-${{ steps.build.outputs.php_version }}' -DisplayName 'PHP 8.5'
