name: Build Rust MSVC

on:
  schedule:
    # 每周五 02:00（北京时间 UTC+8）；cron 以 UTC 表达 → 周四 18:00
    - cron: '0 18 * * 4'
  workflow_dispatch:
    inputs:
      rust_version:
        description: 'Exact Rust version without leading "v", e.g. 1.99.1. Leave empty for the latest stable release in the official channel TOML.'
        required: false
        default: ''
      draft_release:
        description: 'Publish the GitHub release as a draft.'
        type: boolean
        required: false
        default: false

# 定时与手动构建可能撞车；按环境串行化，避免互相覆盖 build/stage 与常青别名资产
concurrency:
  group: build-rust
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build installer and publish release
    runs-on: windows-latest
    # 下载 + xwin SDK 提取 + 完整 cargo 冒烟 + ISCC 压缩属长任务，给个上限避免悬挂占用 runner
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Locate Inno Setup compiler
        shell: powershell
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            Write-Host 'Inno Setup not preinstalled, installing via Chocolatey...'
            choco install innosetup -y --no-progress --limit-output
            $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          $isccVer = (Get-Item $iscc).VersionInfo.ProductVersion
          Write-Host "ISCC ready: $iscc (version $isccVer)"

      - name: Build Rust installer
        id: build
        shell: powershell
        env:
          # build.ps1 会把它作为 Authorization 头发给 GitHub Releases API：
          # 匿名请求 60 次/小时，共享 runner IP 常年 403（见 doc/lessons.md §8）
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\builders\rust\build.ps1 -RustVersion '${{ inputs.rust_version }}'

      - name: Show build metadata
        shell: powershell
        run: |
          Get-Content .\build\output\build-info.json
          Write-Host "rust version = ${{ steps.build.outputs.rust_version }}"
          Write-Host "Installer    = ${{ steps.build.outputs.setup_name }}"

      # The runner has Visual Studio, so the installer would normally take the
      # "system MSVC usable" branch and never write the fallback cargo config.
      # /FORCEFALLBACK=1 installs to a scratch dir on purpose and proves the
      # LLD + staged SDK path works after a real (silent) install — the exact
      # path a user without Visual Studio gets.
      - name: Install-test fallback linker on this runner
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Join-Path $PWD "build\output\${{ steps.build.outputs.setup_name }}"
          $testDir = 'C:\pf\rust-installtest'
          $log = Join-Path $env:RUNNER_TEMP 'rust-install.log'
          $cfg = Join-Path $env:USERPROFILE '.cargo\config.toml'
          if (Test-Path $cfg) { Move-Item -Force $cfg "$cfg.pre-installtest" }
          Write-Host "Installing $setup to $testDir (forced fallback)"
          $installer = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/FORCEFALLBACK=1',
            "/DIR=$testDir", "/LOG=$log")
          if ($installer.ExitCode -ne 0) {
            if (Test-Path $log) { Get-Content $log -Tail 120 }
            throw "Installer exited with $($installer.ExitCode)"
          }
          if (-not (Test-Path $cfg)) { throw "fallback cargo config was not written: $cfg" }
          if (-not (Select-String -Path $cfg -Pattern 'win-env: fallback linker config' -Quiet)) {
            throw "fallback marker missing from $cfg"
          }
          $rustLld = Join-Path $testDir 'lib\rustlib\x86_64-pc-windows-msvc\bin\rust-lld.exe'
          $src = Join-Path $env:RUNNER_TEMP 'rust-fallback-smoke'
          if (Test-Path $src) { Remove-Item -Recurse -Force $src }
          New-Item -ItemType Directory -Force $src | Out-Null
          $env:PATH = "$testDir\bin;$env:PATH"
          $cargo = Join-Path $testDir 'bin\cargo.exe'
          $proj = Join-Path $src 'smoke'
          $manifest = Join-Path $proj 'Cargo.toml'
          $prevEap = $ErrorActionPreference
          $ErrorActionPreference = 'Continue'
          try {
            & $cargo new --bin --vcs none $proj 2>&1 | ForEach-Object { Write-Host "  cargo new: $_" }
            if ($LASTEXITCODE -ne 0) { throw 'cargo new failed' }
            $buildLog = & $cargo build --manifest-path $manifest -v 2>&1
            $buildLog | ForEach-Object { Write-Host "  cargo build: $_" }
            if ($LASTEXITCODE -ne 0) { throw 'cargo build failed' }
            # Only the installed config can make cargo pass our absolute
            # rust-lld path; a random link.exe from PATH would not appear here.
            if (-not (($buildLog -join "`n").Contains($rustLld))) {
              throw "cargo did not use the installed rust-lld: $rustLld"
            }
            & (Join-Path $proj 'target\debug\smoke.exe')
            if ($LASTEXITCODE -ne 0) { throw 'installed smoke exe failed' }
            & (Join-Path $testDir 'bin\rust-analyzer.exe') --version
            if ($LASTEXITCODE -ne 0) { throw 'rust-analyzer failed' }
          }
          finally {
            $ErrorActionPreference = $prevEap
          }
          Write-Host 'Install-test fallback linker: OK'

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: rust-${{ steps.build.outputs.rust_version }}-msvc-setup-x64
          if-no-files-found: error
          path: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json
            build/output/release-notes.md

      - name: Check versioned release
        id: rel
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\scripts\test-release-published.ps1 -Tag 'rust-${{ steps.build.outputs.rust_version }}-msvc'

      - name: Publish GitHub release
        if: steps.rel.outputs.published != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: rust-${{ steps.build.outputs.rust_version }}-msvc
          name: 'Rust ${{ steps.build.outputs.rust_version }} MSVC Windows x64 一键安装包'
          body_path: build/output/release-notes.md
          draft: ${{ inputs.draft_release }}
          files: |
            build/output/*.exe
            build/output/*.sha256.txt
            build/output/build-info.json

      - name: Publish evergreen alias release
        if: ${{ !inputs.draft_release }}
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          & .\scripts\publish-alias-release.ps1 -Env 'rust' -Version '${{ steps.build.outputs.rust_version }}' -AssetPath 'build/output/${{ steps.build.outputs.setup_name }}' -VersionedTag 'rust-${{ steps.build.outputs.rust_version }}-msvc' -DisplayName 'Rust (MSVC)'
